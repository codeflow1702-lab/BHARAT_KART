<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatKart | Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
    .cart-container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 30px;
    }

    .cart-items {
        background: white;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .item-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 20px 0;
        border-bottom: 1px solid #eee;
    }

    .item-row:last-child {
        border-bottom: none;
    }

    .item-info {
        display: flex;
        align-items: center;
        gap: 15px;
        min-width: 0;
    }

    .item-img {
        width: 85px;
        height: 85px;
        background: #f4f4f4;
        border-radius: 10px;
        object-fit: cover;
        flex-shrink: 0;
    }

    .item-details h4 {
        margin-bottom: 5px;
        font-size: 16px;
    }

    .item-price {
        color: #777;
        font-size: 14px;
    }

    .item-total {
        margin-top: 5px;
        font-weight: 700;
        font-size: 15px;
    }

    .item-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
    }

    .qty-btn {
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 7px;
        background: #1e1e1e;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }

    .qty-number {
        min-width: 25px;
        text-align: center;
        font-weight: 600;
    }

    .remove-btn {
        border: none;
        background: none;
        color: #e53935;
        font-size: 16px;
        cursor: pointer;
        margin-left: 5px;
    }

    .cart-summary {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        height: fit-content;
    }

    .summary-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .summary-total {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid #eee;
        font-weight: bold;
        font-size: 18px;
    }

    .checkout-btn {
        width: 100%;
        background: #1E1E1E;
        color: white;
        border: none;
        padding: 15px;
        border-radius: 10px;
        margin-top: 20px;
        cursor: pointer;
        font-weight: 600;
    }

    @media (max-width: 768px) {
        .cart-container {
            grid-template-columns: 1fr;
            margin: 20px auto;
            padding: 0 12px;
            gap: 20px;
        }

        .cart-items {
            padding: 15px;
        }

        .item-row {
            align-items: flex-start;
            flex-direction: column;
            gap: 15px;
        }

        .item-info {
            width: 100%;
        }

        .item-actions {
            width: 100%;
            justify-content: flex-end;
        }

        .cart-summary {
            padding: 20px;
        }

        .item-img {
            width: 75px;
            height: 75px;
        }
    }
    </style>
</head>
<body>

    <nav>
        <a href="home.html" class="logo">BharatKart</a>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="home.html#products">Products</a>
        </div>
        <div class="nav-icons">
            <a href="profile.html"><i class="fa-solid fa-user"></i></a>
        </div>
    </nav>

    <div class="cart-container" id="cartContainer">
        <div class="cart-left">
            <h2 style="margin-bottom:20px;">Shopping Cart</h2>
            <div class="cart-items" id="cartItemsContainer"></div>
        </div>

        <div class="cart-summary">

    <h3>Summary</h3>

    <div class="summary-row" style="margin-top:20px;">
        <span>Subtotal</span>
        <span id="subtotalPrice">₹ 0</span>
    </div>

    <div class="summary-row">
        <span>Tax (5%)</span>
        <span id="taxPrice">₹ 0</span>
    </div>

    <div class="summary-total">
        <span>Total</span>
        <span id="totalPrice">₹ 0</span>
    </div>

    <button
        class="checkout-btn"
        onclick="window.location.href='checkout.html'"
    >
        Checkout
    </button>

        </div>
    </div>

    <div id="emptyCart" style="text-align:center; padding:50px; display:none;">
        <h2>Your cart is empty</h2>
        <a href="home.html" style="color:blue;">Go Shopping</a>
    </div>

    <div id="toast"></div>

    <script type="module">
        import { auth, onAuthStateChanged } from './firebase.js';
        import { getCart, updateQty, saveCart } from './js/cart.js';
        import { showToast } from './js/main.js';

        // Attach to window for onclick events
        window.handleUpdate = (index, change) => {
            let cart = getCart();
            const item = cart[index];
            
            // Update logic
            item.quantity += change;
            if(item.quantity <= 0) cart.splice(index, 1);
            
            saveCart(cart);
            renderCart();
        };

        window.removeItem = (index) => {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
            renderCart();
            showToast("Item removed");
        };

        function renderCart() {
            const cart = getCart();
            const container = document.getElementById("cartItemsContainer");
            const main = document.getElementById("cartContainer");
            const empty = document.getElementById("emptyCart");

            if (cart.length === 0) {
                main.style.display = "none";
                empty.style.display = "block";
                return;
            }

            main.style.display = "grid";
            empty.style.display = "none";
            container.innerHTML = "";

            let total = 0;

            cart.forEach((item, index) => {

    const itemTotal = item.price * item.quantity;

    total += itemTotal;

    container.innerHTML += `
        <div class="item-row">

            <div class="item-info">

                <img
                    src="${item.image}"
                    class="item-img"
                    onerror="this.style.display='none'"
                >

                <div class="item-details">

                    <h4>${item.name}</h4>

                    <p class="item-price">
                        ₹ ${item.price} each
                    </p>

                    <p class="item-total">
                        Item total: ₹ ${itemTotal}
                    </p>

                </div>

            </div>

            <div class="item-actions">

                <button
                    class="qty-btn"
                    onclick="handleUpdate(${index}, -1)"
                >
                    −
                </button>

                <span class="qty-number">
                    ${item.quantity}
                </span>

                <button
                    class="qty-btn"
                    onclick="handleUpdate(${index}, 1)"
                >
                    +
                </button>

                <button
                    class="remove-btn"
                    onclick="removeItem(${index})"
                    title="Remove item"
                >
                    <i class="fa-solid fa-trash"></i>
                </button>

            </div>

        </div>
    `;
});
            const tax = Math.round(total * 0.05);
const finalTotal = total + tax;

document.getElementById("subtotalPrice").innerText =
    "₹ " + total;

document.getElementById("taxPrice").innerText =
    "₹ " + tax;

document.getElementById("totalPrice").innerText =
    "₹ " + finalTotal;

        renderCart();

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login/login.html";
        });
    </script>
</body>
</html>
