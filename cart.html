<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatKart | Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }
        .cart-items { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; }
        .item-img { width: 80px; height: 80px; background: #eee; border-radius: 10px; object-fit: cover; }
        .cart-summary { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); height: fit-content; }
        .checkout-btn { width: 100%; background: #1E1E1E; color: white; border: none; padding: 15px; border-radius: 10px; margin-top: 20px; cursor: pointer; font-weight: 600; }
        @media (max-width: 768px) { .cart-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">BharatKart</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#products">Products</a>
        </div>
        <div class="nav-icons">
            <a href="profile.html"><i class="fa-solid fa-user"></i></a>
        </div>
    </nav>

    <div class="cart-container" id="cartContainer">
        <div class="cart-left">
            <h2 style="margin-bottom:20px;">Shopping Cart</h2>
            <div class="cart-items" id="cartItemsContainer"></div>
        </div>

        <div class="cart-summary">
            <h3>Summary</h3>
            <br>
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>Subtotal</span> <span id="subtotalPrice">₹ 0</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:20px; font-weight:bold; font-size:18px;">
                <span>Total</span> <span id="totalPrice">₹ 0</span>
            </div>
            <button class="checkout-btn" onclick="window.location.href='checkout.html'">Checkout</button>
        </div>
    </div>

    <div id="emptyCart" style="text-align:center; padding:50px; display:none;">
        <h2>Your cart is empty</h2>
        <a href="index.html" style="color:blue;">Go Shopping</a>
    </div>

    <div id="toast"></div>

    <script type="module">
        import { auth, onAuthStateChanged } from './firebase.js';
        import { getCart, updateQty, saveCart } from './js/cart.js';
        import { showToast } from './js/main.js';

        // Attach to window for onclick events
        window.handleUpdate = (index, change) => {
            let cart = getCart();
            const item = cart[index];
            
            // Update logic
            item.quantity += change;
            if(item.quantity <= 0) cart.splice(index, 1);
            
            saveCart(cart);
            renderCart();
        };

        window.removeItem = (index) => {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
            renderCart();
            showToast("Item removed");
        };

        function renderCart() {
            const cart = getCart();
            const container = document.getElementById("cartItemsContainer");
            const main = document.getElementById("cartContainer");
            const empty = document.getElementById("emptyCart");

            if (cart.length === 0) {
                main.style.display = "none";
                empty.style.display = "block";
                return;
            }

            main.style.display = "grid";
            empty.style.display = "none";
            container.innerHTML = "";

            let total = 0;

            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                container.innerHTML += `
                    <div class="item-row">
                        <div style="display:flex; gap:15px; align-items:center;">
                            <img src="${item.image}" class="item-img">
                            <div>
                                <h4>${item.name}</h4>
                                <p>₹ ${item.price} x ${item.quantity}</p>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <button onclick="handleUpdate(${index}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="handleUpdate(${index}, 1)">+</button>
                            <button onclick="removeItem(${index})" style="color:red; border:none; background:none; margin-left:10px;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            document.getElementById("subtotalPrice").innerText = "₹ " + total;
            document.getElementById("totalPrice").innerText = "₹ " + Math.round(total * 1.05); // 5% tax
        }

        renderCart();

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login/login.html";
        });
    </script>
</body>
</html>
