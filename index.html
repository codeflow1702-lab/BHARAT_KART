<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatKart Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&display=swap');
        * { box-sizing: border-box; }
        
        /* Ensure body allows scrolling after animation */
        body { 
            background: #f6f5f7; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            font-family: 'Montserrat', sans-serif; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; /* Temporarily hidden for splash */
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        #splash-logo { width: 250px; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* --- MAIN UI --- */
        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
            position: relative;
            overflow: hidden;
            width: 768px;
            max-width: 100%;
            min-height: 480px;
            
            /* FIX: Don't hide it completely, just fade it in */
            opacity: 0; 
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* When this class is added, the form appears */
        .container.show { opacity: 1; transform: translateY(0); }

        /* Standard Form CSS */
        h1 { font-weight: bold; margin: 0; }
        p { font-size: 14px; font-weight: 100; line-height: 20px; letter-spacing: 0.5px; margin: 20px 0 30px; }
        span { font-size: 12px; }
        a { color: #333; font-size: 14px; text-decoration: none; margin: 15px 0; cursor: pointer; }
        button { border-radius: 20px; border: 1px solid #0f172a; background-color: #0f172a; color: #FFFFFF; font-size: 12px; font-weight: bold; padding: 12px 45px; letter-spacing: 1px; text-transform: uppercase; transition: transform 80ms ease-in; cursor: pointer; margin-top: 10px; }
        button:active { transform: scale(0.95); }
        button.ghost { background-color: transparent; border-color: #FFFFFF; }
        form { background-color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 0 50px; height: 100%; text-align: center; }
        input { background-color: #eee; border: none; padding: 12px 15px; margin: 8px 0; width: 100%; }
        
        .password-container { position: relative; width: 100%; }
        .password-container input { padding-right: 40px; }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; z-index: 10; }
        .social-container { margin: 20px 0; }
        .social-container a { border: 1px solid #DDDDDD; border-radius: 50%; display: inline-flex; justify-content: center; align-items: center; margin: 0 5px; height: 40px; width: 40px; }
        
        .form-container { position: absolute; top: 0; height: 100%; transition: all 0.6s ease-in-out; }
        .sign-in-container { left: 0; width: 50%; z-index: 2; }
        .container.right-panel-active .sign-in-container { transform: translateX(100%); }
        .sign-up-container { left: 0; width: 50%; opacity: 0; z-index: 1; }
        .container.right-panel-active .sign-up-container { transform: translateX(100%); opacity: 1; z-index: 5; animation: show 0.6s; }
        @keyframes show { 0%, 49.99% { opacity: 0; z-index: 1; } 50%, 100% { opacity: 1; z-index: 5; } }
        
        .overlay-container { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; overflow: hidden; transition: transform 0.6s ease-in-out; z-index: 100; }
        .container.right-panel-active .overlay-container { transform: translateX(-100%); }
        .overlay { background: linear-gradient(to right, #2c3e50, #000000); color: #FFFFFF; position: relative; left: -100%; height: 100%; width: 200%; transform: translateX(0); transition: transform 0.6s ease-in-out; }
        .container.right-panel-active .overlay { transform: translateX(50%); }
        .overlay-panel { position: absolute; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 0 40px; text-align: center; top: 0; height: 100%; width: 50%; transform: translateX(0); transition: transform 0.6s ease-in-out; }
        .overlay-left { transform: translateX(-20%); }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .overlay-right { right: 0; transform: translateX(0); }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }

        /* Toast CSS */
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e1e1e; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: all 0.4s ease; z-index: 9999; }
        #toast.show { opacity: 1; bottom: 50px; }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <!-- If logo.png is missing, this box will be white. That is okay. -->
        <img src="logo.png" alt="BharatKart Logo" id="splash-logo">
    </div>

    <!-- MAIN LOGIN CONTAINER -->
    <div class="container" id="container">
        <!-- Sign Up -->
        <div class="form-container sign-up-container">
            <form>
                <h1>Create Account</h1>
                <div class="social-container">
                    <a href="#" class="social" onclick="showToast('Facebook login coming soon')"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social" onclick="showToast('Google login coming soon')"><i class="fab fa-google"></i></a>
                </div>
                <span>or use your email for registration</span>
                <input type="text" id="signupName" placeholder="Name" />
                <input type="email" id="signupEmail" placeholder="Email" />
                <div class="password-container">
                    <input type="password" id="signupPassword" placeholder="Password" />
                    <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePasswordVisibility('signupPassword', this)"></i>
                </div>
                <button type="button" onclick="signUpUser()">Sign Up</button>
            </form>
        </div>

        <!-- Sign In -->
        <div class="form-container sign-in-container">
            <form>
                <h1>Sign in</h1>
                <div class="social-container">
                    <a href="#" class="social" onclick="showToast('Facebook login coming soon')"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social" onclick="showToast('Google login coming soon')"><i class="fab fa-google"></i></a>
                </div>
                <span>or use your account</span>
                <input type="email" id="loginEmail" placeholder="Email" />
                <div class="password-container">
                    <input type="password" id="loginPassword" placeholder="Password" />
                    <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePasswordVisibility('loginPassword', this)"></i>
                </div>
                <a href="#" onclick="showToast('Feature coming soon!'); return false;">Forgot your password?</a>
                <button type="button" onclick="signInUser()">Sign In</button>
            </form>
        </div>

        <!-- Overlay -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Hello, Friend!</h1>
                    <p>Enter your personal details and start your shopping journey with BharatKart</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with BharatKart please login with your personal info</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <!-- 1. UI LOGIC (Runs Immediately - Fixes White Screen) -->
    <script>
        const splashScreen = document.getElementById('splash-screen');
        const container = document.getElementById('container');

        // Function to remove splash and show form
        function removeSplash() {
            splashScreen.classList.add('hidden');
            setTimeout(() => {
                container.classList.add('show');
                splashScreen.style.display = 'none';
                document.body.style.overflow = "auto"; 
            }, 500);
        }

        // Run this when the DOM is ready (Faster than window.load)
        document.addEventListener('DOMContentLoaded', () => {
            // Wait 2 seconds for effect, then force remove splash
            setTimeout(removeSplash, 2000);
        });

        // Backup: If something gets stuck, force remove after 5 seconds
        setTimeout(removeSplash, 5000);

        // UI Toggles
        document.getElementById('signUp').addEventListener('click', () => container.classList.add("right-panel-active"));
        document.getElementById('signIn').addEventListener('click', () => container.classList.remove("right-panel-active"));

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 2500);
        }

        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") { input.type = "text"; icon.classList.replace("fa-eye-slash", "fa-eye"); } 
            else { input.type = "password"; icon.classList.replace("fa-eye", "fa-eye-slash"); }
        }
    </script>

    <!-- 2. FIREBASE LOGIC (Loads in Background) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDLCNAA-bbUo2EQfp1EDfGE76b8iSQmCTI",
          authDomain: "bharat-c734b.firebaseapp.com",
          projectId: "bharat-c734b",
          appId: "1:273763763790:web:b2499eff81a4b5b5c3651f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.signUpUser = () => {
            const email = document.getElementById("signupEmail").value;
            const password = document.getElementById("signupPassword").value;
            if(!email || !password) { showToast("Please enter all details 📝"); return; }
            if(password.length < 6) { showToast("Password must be 6+ characters 🔒"); return; }

            createUserWithEmailAndPassword(auth, email, password)
            .then(() => showToast("Account Created! Please Sign In ✅"))
            .catch((err) => showToast(err.message));
        };

        window.signInUser = () => {
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;
            if(!email || !password) { showToast("Please enter all details 📝"); return; }
            
            signInWithEmailAndPassword(auth, email, password)
            .then(() => {
                showToast("Login Successful 🎉");
                setTimeout(() => { window.location.href = "../home.html"; }, 1000);
            })
            .catch((err) => showToast("Error: " + err.message));
        };
    </script>
</body>
</html>
