<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatKart | My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* All your existing profile page CSS here... it's unchanged */
        :root { --primary: #C1DCDC; --dark: #1E1E1E; --gray: #777; }
        body { background-color: #f9f9f9; color: var(--dark); font-family: 'Poppins', sans-serif; }
        .profile-container { max-width: 800px; margin: 50px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .profile-pic { width: 120px; height: 120px; background: var(--primary); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 50px; color: white; }
        .email-text { color: var(--gray); margin-bottom: 30px; font-size: 14px; }
        .profile-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .menu-item { background: #f4f4f4; padding: 20px; border-radius: 15px; text-decoration: none; color: var(--dark); transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .menu-item:hover { background: var(--primary); color: white; transform: translateY(-3px); }
        .logout-btn { background: #ff4d4d; color: white; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 600; margin-top: 40px; cursor: pointer; width: 100%; max-width: 200px; }
        
        /* ✅ Toast CSS */
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e1e1e; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: all 0.4s ease; z-index: 9999; }
        #toast.show { opacity: 1; bottom: 50px; }
    </style>
</head>
<body>
    <!-- NAV, PROFILE CARD, etc -->
    <div class="profile-container">
        <div class="profile-pic"><i class="fa-solid fa-user"></i></div>
        <h2 id="userName">User</h2>
        <p class="email-text" id="userEmail">Loading...</p>
        <div class="profile-menu">
            <a href="user-order.html" class="menu-item">
    <i class="fa-solid fa-box-open"></i>
    <span>My Orders</span>
            </a>
            <a href="wishlist.html" class="menu-item">
    <i class="fa-solid fa-heart"></i>
    <span>Wishlist</span>
            </a>
        </div>
        <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>

    <!-- ✅ Toast HTML -->
    <div id="toast"></div>

    <!-- UI SCRIPT -->
    <script>
        // ✅ Toast JS Function
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 2500);
        }
    </script>
    
    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        const firebaseConfig = { apiKey: "AIzaSyDLCNAA-bbUo2EQfp1EDfGE76b8iSQmCTI", authDomain: "bharat-c734b.firebaseapp.com", projectId: "bharat-c734b", appId: "1:273763763790:web:b2499eff81a4b5b5c3651f" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('userEmail').innerText = user.email;
            } else {
                window.location.href = "login page/index.html";
            }
        });
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                showToast("Logged out successfully 👋");
                setTimeout(() => { window.location.href = "login page/index.html"; }, 1500);
            }).catch((error) => { showToast("Logout error: " + error.message); });
        });
    </script>
</body>
</html>
