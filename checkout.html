<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatKart | Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #3b82f6; --dark: #1e293b; --bg: #f8fafc; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; color: var(--dark); }

        .container { max-width: 1000px; margin: 40px auto; padding: 20px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }
        
        /* LEFT: FORM */
        .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 20px; font-weight: 700; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--primary); }

        /* RIGHT: SUMMARY */
        .summary-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); height: fit-content; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; color: #64748b; }
        .total-row { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid #f1f5f9; font-weight: 700; font-size: 20px; color: var(--dark); }

        .place-order-btn { width: 100%; background: var(--dark); color: white; padding: 15px; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .place-order-btn:hover { background: var(--primary); }
        .place-order-btn:disabled { background: #ccc; cursor: not-allowed; }

        .coupon-box {
            margin: 20px 0;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }
        .coupon-row { display: flex; gap: 8px; }
        .coupon-row input { flex: 1; box-sizing: border-box; text-transform: uppercase; }
        .coupon-btn {
            border: none; background: #3b82f6; color: white; padding: 0 16px;
            border-radius: 8px; cursor: pointer; font-weight: 600;
        }
        .coupon-btn:disabled { opacity: .6; cursor: not-allowed; }
        .coupon-message { margin-top: 8px; font-size: 12px; min-height: 16px; }
        .coupon-success { color: #15803d; }
        .coupon-error { color: #dc2626; }
        .discount-row { color: #15803d !important; font-weight: 600; }

        @media(max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
<link rel="stylesheet" href="../../assets/bharatkart-ui.css">
</head>
<body>

    <div class="container">
        <!-- SHIPPING DETAILS -->
        <div class="form-card">
            <h2>Shipping Details</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" required placeholder="+91 9876543210">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" required placeholder="House No, Street Area">
                </div>
                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>City</label>
                        <input type="text" id="city" required>
                    </div>
                    <div>
                        <label>Pincode</label>
                        <input type="number" id="pincode" required>
                    </div>
                </div>
                
                <h2 style="margin-top: 30px;">Payment Method</h2>
                <div class="form-group">
                    <select id="paymentMethod">
                        <option value="COD">Cash on Delivery (COD)</option>
                        <option value="ONLINE" disabled>Online Payment (Coming Soon)</option>
                    </select>
                </div>
            </form>
        </div>

        <!-- ORDER SUMMARY -->
        <div class="summary-card">
            <h2>Order Summary</h2>
            <div id="orderItems"></div>

            <div class="coupon-box">
                <strong>Have a coupon?</strong>
                <div class="coupon-row" style="margin-top:10px;">
                    <input type="text" id="couponCode" placeholder="Enter coupon code" maxlength="30">
                    <button type="button" class="coupon-btn" id="applyCouponBtn" onclick="applyCoupon()">Apply</button>
                </div>
                <div id="couponMessage" class="coupon-message"></div>
            </div>

            <div class="summary-row" style="margin-top: 20px;">
                <span>Subtotal</span>
                <span id="subtotalAmount">₹ 0</span>
            </div>

            <div class="summary-row discount-row">
                <span>Discount</span>
                <span id="discountAmount">- ₹ 0</span>
            </div>

            <div class="summary-row">
                <span>Tax (5%)</span>
                <span id="taxAmount">₹ 0</span>
            </div>

            <div class="total-row">
                <span>Total Amount</span>
                <span id="totalAmount" style="color: black; font-weight: 700;">₹ 0</span>
            </div>

            <button class="place-order-btn" id="placeOrderBtn" onclick="placeOrder()">Place Order</button>
        </div>
    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLCNAA-bbUo2EQfp1EDfGE76b8iSQmCTI",
            authDomain: "bharat-c734b.firebaseapp.com",
            projectId: "bharat-c734b",
            appId: "1:273763763790:web:b2499eff81a4b5b5c3651f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let availableCoupons = [];
        let appliedCoupon = null;
        let subtotal = 0;
        let discount = 0;
        let tax = 0;
        let finalTotal = 0;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadCoupons();
                loadSummary();
            } else {
                window.location.href = "login page/index.html";
            }
        });

        async function loadCoupons() {
            try {
                const snapshot = await getDocs(collection(db, "coupons"));
                const now = new Date();
                availableCoupons = [];

                snapshot.forEach((docSnap) => {
                    const coupon = docSnap.data();
                    if (coupon.active !== true) return;

                    const expiry = coupon.expiryDate ? new Date(coupon.expiryDate + "T23:59:59") : null;
                    if (expiry && !isNaN(expiry.getTime()) && expiry < now) return;

                    availableCoupons.push({
                        id: docSnap.id,
                        ...coupon,
                        code: String(coupon.code || docSnap.id).toUpperCase()
                    });
                });
            } catch (error) {
                console.error("Could not load coupons:", error);
                availableCoupons = [];
            }
        }

        function loadSummary() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                window.location.href = "home.html";
                return;
            }

            const summaryDiv = document.getElementById("orderItems");
            summaryDiv.innerHTML = "";
            subtotal = 0;

            cart.forEach(item => {
                const price = Number(item.price) || 0;
                const quantity = Number(item.quantity) || 0;
                const itemTotal = price * quantity;
                subtotal += itemTotal;

                const div = document.createElement("div");
                div.className = "summary-row";
                div.innerHTML = `
                    <span>${item.name} × ${quantity}</span>
                    <span>₹${itemTotal}</span>
                `;
                summaryDiv.appendChild(div);
            });

            recalculateTotal();
        }

        function recalculateTotal() {
            discount = 0;

            if (appliedCoupon) {
                if (appliedCoupon.type === "percentage") {
                    const percentage = Math.min(Math.max(Number(appliedCoupon.value) || 0, 0), 100);
                    discount = Math.round(subtotal * percentage / 100);
                } else {
                    discount = Math.min(Math.max(Number(appliedCoupon.value) || 0, 0), subtotal);
                }
            }

            const discountedSubtotal = Math.max(0, subtotal - discount);
            tax = Math.round(discountedSubtotal * 0.05);
            finalTotal = discountedSubtotal + tax;

            document.getElementById("subtotalAmount").innerText = "₹ " + subtotal;
            document.getElementById("discountAmount").innerText = "- ₹ " + discount;
            document.getElementById("taxAmount").innerText = "₹ " + tax;
            document.getElementById("totalAmount").innerText = "₹ " + finalTotal;
        }

        window.applyCoupon = async () => {
            const input = document.getElementById("couponCode");
            const message = document.getElementById("couponMessage");
            const btn = document.getElementById("applyCouponBtn");
            const code = input.value.trim().toUpperCase();

            message.className = "coupon-message";
            message.innerText = "";

            if (!code) {
                message.classList.add("coupon-error");
                message.innerText = "Please enter a coupon code.";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Checking...";

            try {
                await loadCoupons();
                const coupon = availableCoupons.find(c => c.code === code);

                if (!coupon) {
                    appliedCoupon = null;
                    recalculateTotal();
                    message.classList.add("coupon-error");
                    message.innerText = "Invalid or expired coupon.";
                    return;
                }

                const minOrder = Number(coupon.minOrder) || 0;
                if (subtotal < minOrder) {
                    appliedCoupon = null;
                    recalculateTotal();
                    message.classList.add("coupon-error");
                    message.innerText = `Minimum order value is ₹${minOrder}.`;
                    return;
                }

                appliedCoupon = coupon;
                recalculateTotal();

                message.classList.add("coupon-success");
                const label = coupon.type === "percentage"
                    ? `${coupon.value}% discount`
                    : `₹${coupon.value} discount`;
                message.innerText = `Coupon ${coupon.code} applied — ${label}.`;
            } catch (error) {
                console.error(error);
                message.classList.add("coupon-error");
                message.innerText = "Unable to verify coupon. Please try again.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Apply";
            }
        };

        window.placeOrder = async () => {
            const btn = document.getElementById("placeOrderBtn");

            const name = document.getElementById("fullName").value;
            const phone = document.getElementById("phone").value;
            const address = document.getElementById("address").value;
            const city = document.getElementById("city").value;
            const pincode = document.getElementById("pincode").value;

            if (!name || !phone || !address || !city || !pincode) {
                alert("Please fill in all shipping details");
                return;
            }

            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                subtotal = cart.reduce((sum, item) => {
                    const price = Number(item.price) || 0;
                    const quantity = Number(item.quantity) || 0;
                    return sum + (price * quantity);
                }, 0);

                recalculateTotal();

                const orderData = {
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    items: cart,
                    subtotal: subtotal,
                    discount: discount,
                    tax: tax,
                    amount: finalTotal,
                    couponCode: appliedCoupon ? appliedCoupon.code : null,
                    couponType: appliedCoupon ? appliedCoupon.type : null,
                    shipping: {
                        name: name,
                        phone: phone,
                        address: address,
                        city: city,
                        pincode: pincode
                    },
                    status: "Placed",
                    paymentMethod: document.getElementById("paymentMethod").value,
                    createdAt: serverTimestamp()
                };

                await addDoc(collection(db, "orders"), orderData);

                localStorage.removeItem("cart");
                window.location.href = "order-success.html";
            } catch (error) {
                console.error("Error placing order: ", error);
                alert("Order Failed: " + error.message);
                btn.innerText = "Place Order";
                btn.disabled = false;
            }
        };
    </script>
<script src="../../assets/bharatkart-ui.js"></script>
</body>
</html>
