<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Poppins', sans-serif; background: #f8fafc; text-align: center; }
        .card { background: white; padding: 50px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .icon-circle { width: 80px; height: 80px; background: #dcfce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .icon-circle i { font-size: 40px; color: #22c55e; }
        h1 { margin-bottom: 10px; color: #1e293b; }
        p { color: #64748b; margin-bottom: 30px; }
        .btn { background: #1e293b; color: white; padding: 12px 30px; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .btn:hover { background: #3b82f6; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">
            <i class="fa-solid fa-check"></i>
        </div>
        <h1>Order Placed Successfully!</h1>
        <p>Thank you for shopping with BharatKart.<br>You will receive a confirmation shortly.</p>
        <a href="home.html" class="btn">Continue Shopping</a>
    </div>
</body>
</html>
